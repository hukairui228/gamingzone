<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0614" />
<title>霓虹港湾：街头之王</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<canvas id="game"></canvas>

<!-- ===== HUD ===== -->
<div id="hud" class="hidden">
  <div id="topright">
    <div id="clock">18:00</div>
    <div id="money">$0</div>
    <div id="stars"></div>
    <div id="weaponbox"><div id="weaponname">拳头</div><div id="ammo"></div></div>
    <div class="bar"><div id="hpbar"></div></div>
    <div class="bar armor"><div id="arbar"></div></div>
    <div class="bar focus"><div id="focusbar"></div></div>
    <div class="bar swim"><div id="swimbar"></div></div>
  </div>
  <div id="territoryprog" style="display:none"><div class="label">占领进度</div><div class="progbar"><div class="fill"></div></div></div>
  <div id="minimapwrap"><canvas id="minimap" width="220" height="220"></canvas><div id="zone"></div></div>
  <div id="speedo" class="hidden">
    <div id="speedval">0</div><div class="unit">km/h</div>
    <div class="bar nitro"><div id="nitrobar"></div></div>
    <div id="carname"></div>
    <div id="radioname"></div>
  </div>
  <div id="objective"></div>
  <div id="timer" class="hidden"></div>
  <div id="subtitle"></div>
  <div id="notify"></div>
  <div id="prompt"></div>
  <div id="drift"></div>
  <div id="bigtext"></div>
  <div id="crosshair" class="hidden"></div>
  <div id="hitmarker"></div>
  <div id="damageflash"></div>
  <div id="focusoverlay"></div>
</div>

<!-- ===== Touch controls ===== -->
<div id="touch" class="hidden">
  <div id="stick"><div id="stickknob"></div></div>
  <div id="tbtns">
    <button data-k="fire" class="tb big">🔫</button>
    <button data-k="jump" class="tb">⤒</button>
    <button data-k="enter" class="tb">🚗</button>
    <button data-k="sprint" class="tb">⚡</button>
    <button data-k="focus" class="tb">⏱</button>
    <button data-k="weapon" class="tb">⟳</button>
  </div>
  <button id="tpause" class="tb small">☰</button>
</div>

<!-- ===== Menus ===== -->
<div id="loading">
  <div class="logo"><span class="l1">霓虹港湾</span><span class="l2">STREETS OF SOLARA BAY</span></div>
  <div id="loadbar"><div id="loadfill"></div></div>
  <div id="loadtext">正在建造城市…</div>
</div>

<div id="title" class="menu hidden">
  <div class="logo"><span class="l1">霓虹港湾</span><span class="l2">街 头 之 王</span></div>
  <div class="menubtns">
    <button id="btnContinue" class="mbtn hidden">继续游戏</button>
    <button id="btnNew" class="mbtn">新的游戏</button>
    <button id="btnSettings1" class="mbtn">画质与设置</button>
    <button id="btnHelp1" class="mbtn">操作说明</button>
  </div>
  <div class="credit">原创开放世界动作游戏 · Three.js WebGL2</div>
</div>

<div id="pause" class="menu hidden">
  <div class="tabs">
    <button data-tab="map" class="tab active">地图</button>
    <button data-tab="stats" class="tab">进度</button>
    <button data-tab="settings" class="tab">设置</button>
    <button data-tab="help" class="tab">操作</button>
  </div>
  <div class="tabbody" id="tab-map"><canvas id="bigmap" width="900" height="900"></canvas><div class="maphint">点击地图设置导航点 · 滚轮缩放</div></div>
  <div class="tabbody hidden" id="tab-stats"></div>
  <div class="tabbody hidden" id="tab-settings"></div>
  <div class="tabbody hidden" id="tab-help"></div>
  <div class="menubtns row">
    <button id="btnResume" class="mbtn">继续</button>
    <button id="btnSave" class="mbtn">保存</button>
    <button id="btnQuit" class="mbtn">回到标题</button>
  </div>
</div>

<div id="settingsPanel" class="menu hidden"><div id="settingsBody"></div><button id="btnSettingsBack" class="mbtn">返回</button></div>
<div id="helpPanel" class="menu hidden"><div id="helpBody"></div><button id="btnHelpBack" class="mbtn">返回</button></div>

<div id="shop" class="menu hidden">
  <h2 id="shopTitle"></h2>
  <div id="shopBody"></div>
  <button id="btnShopClose" class="mbtn">离开</button>
</div>

<div id="phone" class="menu hidden">
  <div class="phone-frame">
    <div class="phone-header">手机</div>
    <div class="phone-grid">
      <button class="phone-btn" data-phone="map"><span>地图</span></button>
      <button class="phone-btn" data-phone="weapons"><span>武器库</span></button>
      <button class="phone-btn" data-phone="stats"><span>统计</span></button>
      <button class="phone-btn" data-phone="territory"><span>地盘</span></button>
      <button class="phone-btn" data-phone="save"><span>存档</span></button>
      <button class="phone-btn" data-phone="close"><span>关闭</span></button>
    </div>
    <div id="phone-detail" class="hidden"></div>
  </div>
</div>

<div id="photo" class="hidden"><div>📷 拍照模式 · 鼠标拖动旋转 · 滚轮缩放 · 1-5 切换滤镜 · P 退出</div></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
